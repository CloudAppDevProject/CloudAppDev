  #       condition: service_healthy
  #   env_file:
  #     - .env
  #   ports:
  #     - "3000:3000"

  # Proxy wird nur für Deployment verwendet
  # proxy:
  #   build:
  #     context: ./nginx
  #     dockerfile: Dockerfile
  #   container_name: cloudappdev_proxy
