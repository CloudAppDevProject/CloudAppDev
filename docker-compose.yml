services:
  db:
    image: postgres:16
    container_name: cloudappdev_db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-appdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build: .
    container_name: cloudappdev_frontend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"

  proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: cloudappdev_proxy
    restart: unless-stopped
    depends_on:
      - frontend
    env_file:
      - .env   # uses DOMAIN for paths/template
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/etc/letsencrypt:ro

  certbot:
    image: serversideup/certbot-dns-cloudflare
    volumes:
      - letsencrypt:/etc/letsencrypt
    env_file:
      - .env
    environment:
      CERTBOT_KEY_TYPE: "rsa"

volumes:
  db_data:
  letsencrypt:
