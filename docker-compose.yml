services:
  db:
    image: postgres:16
    container_name: cloudappdev_db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-appdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:8.0
    container_name: cloudappdev_mongodb
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-appdb}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: .
      args:
        # Pass Firebase config to build stage (baked into client bundle)
        FIREBASE_API_KEY_BUILD: ${NEXT_PUBLIC_GOOGLE_CLOUD_AUTH_KEY}
        FIREBASE_AUTH_DOMAIN_BUILD: ${NEXT_PUBLIC_GOOGLE_CLOUD_AUTH_DOMAIN}
        FIREBASE_PROJECT_BUILD: ${NEXT_PUBLIC_GOOGLE_CLOUD_PROJECT_ID}
    container_name: cloudappdev_frontend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Server-side environment variables
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/${MONGO_INITDB_DATABASE:-appdb}?authSource=admin
      NODE_ENV: production
      PORT: 3000
      
      # Google Cloud Storage (Server-side for file uploads)
      GOOGLE_CLOUD_PROJECT_ID: ${GOOGLE_CLOUD_PROJECT_ID}
      GOOGLE_CLOUD_STORAGE_BUCKET: ${GOOGLE_CLOUD_STORAGE_BUCKET}
      GOOGLE_CLOUD_CREDENTIALS_BASE64: ${GOOGLE_CLOUD_CREDENTIALS_BASE64}
      
      # Firebase Admin SDK (Server-side for token verification)
      FIREBASE_SERVICE_ACCOUNT_JSON_BASE64: ${FIREBASE_SERVICE_ACCOUNT_JSON_BASE64}
      
      # Client-side Firebase config (NEXT_PUBLIC_* variables - baked into bundle)
      NEXT_PUBLIC_GOOGLE_CLOUD_AUTH_KEY: ${NEXT_PUBLIC_GOOGLE_CLOUD_AUTH_KEY}
      NEXT_PUBLIC_GOOGLE_CLOUD_AUTH_DOMAIN: ${NEXT_PUBLIC_GOOGLE_CLOUD_AUTH_DOMAIN}
      NEXT_PUBLIC_GOOGLE_CLOUD_PROJECT_ID: ${NEXT_PUBLIC_GOOGLE_CLOUD_PROJECT_ID}
    ports:
      - "3000:3000"

  proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: cloudappdev_proxy
    restart: unless-stopped
    depends_on:
      - frontend
    env_file:
      - .env   # uses DOMAIN for paths/template
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/etc/letsencrypt:ro

  certbot:
    image: serversideup/certbot-dns-cloudflare
    volumes:
      - letsencrypt:/etc/letsencrypt
    env_file:
      - .env
    environment:
      CERTBOT_KEY_TYPE: "rsa"

volumes:
  db_data:
  mongo_data:
  mongo_config:
  letsencrypt:
