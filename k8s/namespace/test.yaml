apiVersion: apps/v1
kind: Deployment
metadata:
  name: test4-app
  namespace: test4
  labels: 
    helm.sh/chart: app-1.0.2
    app.kubernetes.io/name: app
    app.kubernetes.io/instance: test4
    app.kubernetes.io/version: "0.0.9"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      
      app.kubernetes.io/name: app
      app.kubernetes.io/instance: test4
  template:
    metadata:
      labels:
        
        app.kubernetes.io/name: app
        app.kubernetes.io/instance: test4
    spec:
      serviceAccountName: app-sa
      containers:
        - name: app
          image: "europe-west1-docker.pkg.dev/cloudappdev-dev/docker-repo/cloudappdev-frontend:0.0.9"
          ports:
            - containerPort: 3000
          env:
            - name: API_GATEWAY_URL
              valueFrom:
                secretKeyRef:
                  name: cloudappdev-secrets
                  key: API_GATEWAY_URL
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "600m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: "/"
              port: 3000
            initialDelaySeconds: 10
            failureThreshold: 30
            periodSeconds: 1
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: "/"
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: "/"
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 2
