# Source: cloudappdev/charts/social-service/templates/cronjob.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  namespace: test4
  name: test4-social-service-newsletter
  labels:
    helm.sh/chart: social-service-1.0.1
    app.kubernetes.io/name: social-service
    app.kubernetes.io/instance: test4
    app.kubernetes.io/version: "0.0.9"
    app.kubernetes.io/managed-by: Helm
    component: newsletter
  annotations:
    description: "Weekly newsletter distribution job for CloudAppDev platform"
spec:
  schedule: "0 20 * * 0"
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: social-service
            app.kubernetes.io/instance: test4
            job-type: newsletter
          annotations:
            description: "Weekly newsletter send job"
        spec:
          serviceAccountName: social-service-sa
          restartPolicy: OnFailure
          containers:
          - name: newsletter-sender
            image: "europe-west1-docker.pkg.dev/cloudappdev-dev/docker-repo/cloudappdev-social-service:0.2.30"
            imagePullPolicy: Always
            command:
            - npm
            - run
            - newsletter:send-weekly
            env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: social-service-secrets
                  key: MONGODB_URI
            - name: SENDGRID_API_KEY
              valueFrom:
                secretKeyRef:
                  name: social-service-secrets
                  key: SENDGRID_API_KEY
            - name: SENDGRID_FROM_EMAIL
              valueFrom:
                secretKeyRef:
                  name: social-service-secrets
                  key: SENDGRID_FROM_EMAIL
            - name: SENDGRID_FROM_NAME
              valueFrom:
                secretKeyRef:
                  name: social-service-secrets
                  key: SENDGRID_FROM_NAME
            - name: USER_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: social-service-secrets
                  key: USER_SERVICE_URL
            - name: ITINERARY_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: social-service-secrets
                  key: ITINERARY_SERVICE_URL
            - name: NEWSLETTER_ENABLED
              value: "true"
            - name: NEWSLETTER_BATCH_SIZE
              value: "50"
            - name: NEWSLETTER_RETRY_LIMIT
              value: "3"
            - name: NEWSLETTER_RETRY_DELAY_MS
              value: "5000"
            - name: FRONTEND_URL
              valueFrom:
                secretKeyRef:
                  name: social-service-secrets
                  key: FRONTEND_URL
            - name: NODE_ENV
              value: "production"
            - name: NEWSLETTER_MODE
              valueFrom:
                secretKeyRef:
                  name: social-service-secrets
                  key: NEWSLETTER_MODE
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
          tolerations:
          - effect: NoSchedule
            key: batch-jobs
            operator: Equal
            value: "true"
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                      - cloudappdev-app
                  topologyKey: kubernetes.io/hostname
