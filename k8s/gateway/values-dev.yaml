# Namespace where this chart will be deployed
# Default namespace uses Enterprise tier settings
namespace: default

# Service namespaces for cross-namespace routing
# NOTE: If microservices are deployed in different namespaces,
# the nginx config must use FQDN: service-name.namespace.svc.cluster.local
serviceNamespaces:
  user: default
  itinerary: default
  social: default
  travelInfo: default
  tenant: default

image:
  repository: europe-west1-docker.pkg.dev/cloudappdev-dev/docker-repo/cloudappdev-api-gateway
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []

podLabels:
  tier: enterprise

env:
  - name: RESOLVER_IP
    value: "kube-dns.kube-system.svc.cluster.local"
  - name: USER_NAMESPACE
    value: "default"
  - name: ITINERARY_NAMESPACE
    value: "default"
  - name: SOCIAL_NAMESPACE
    value: "default"
  - name: TRAVEL_INFO_NAMESPACE
    value: "default"
  - name: TENANT_NAMESPACE
    value: "default"

# Enterprise tier resources
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "2000m"
    memory: "1Gi"

service:
  create: true
  type: ClusterIP
  port: 80

livenessProbe:
  httpGet:
    path: /health
    port: http
readinessProbe:
  httpGet:
    path: /health
    port: http

# Enterprise tier autoscaling
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
