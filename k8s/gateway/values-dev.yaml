# Namespace where this chart will be deployed
namespace: default

# Service namespaces for cross-namespace routing
# NOTE: If microservices are deployed in different namespaces,
# the nginx config must use FQDN: service-name.namespace.svc.cluster.local
serviceNamespaces:
  user: default
  itinerary: default
  social: default
  travelInfo: default
  tenant: default

image:
  repository: europe-west1-docker.pkg.dev/cloudappdev-dev/docker-repo/cloudappdev-api-gateway
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []

podLabels: {}

env:
  - name: RESOLVER_IP
    value: "kube-dns.kube-system.svc.cluster.local"

resources:
  limits:
    memory: "512Mi"
    cpu: "1000m"
  requests:
    memory: "32Mi"
    cpu: "50m"
    
# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
# NOTE: Service disabled because Terraform manages the LoadBalancer Service
service:
  create: false  # Terraform creates the LoadBalancer Service
  type: ClusterIP
  port: 80

livenessProbe:
  httpGet:
    path: /health
    port: http
readinessProbe:
  httpGet:
    path: /health
    port: http

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80
