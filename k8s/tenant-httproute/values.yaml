# Default values for tenant-httproute
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

tenant:
  name: ""
  domain: ""
  tier: ""

namespace: ""

gateway:
  name: "main-gateway"
  namespace: "default"

backend:
  serviceName: "app"
  servicePort: 80

# HTTP Route (redirect to HTTPS)
httpRoute:
  enabled: true
  annotations: {}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301

# HTTPS Route
httpsRoute:
  enabled: true
  annotations: {}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
