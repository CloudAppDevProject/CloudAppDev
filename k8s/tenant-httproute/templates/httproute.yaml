apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.tenant.name }}-httproute
  namespace: {{ .Values.namespace }}
  labels:
    tenant: {{ .Values.tenant.name }}
    tier: {{ .Values.tenant.tier }}
spec:
  parentRefs:
  - name: {{ .Values.gateway.name }}
    namespace: {{ .Values.gateway.namespace }}
  hostnames:
  - {{ .Values.tenant.domain }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ .Values.backend.serviceName }}
      port: {{ .Values.backend.servicePort }}
