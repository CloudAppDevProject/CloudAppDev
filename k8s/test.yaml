# Source: social/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: default
  name: test-social
  labels:
    helm.sh/chart: social-1.1.0
    app.kubernetes.io/name: social
    app.kubernetes.io/instance: test
    app.kubernetes.io/version: "0.0.9"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: social
      app.kubernetes.io/instance: test
  template:
    metadata:
      labels:
        helm.sh/chart: social-1.1.0
        app.kubernetes.io/name: social
        app.kubernetes.io/instance: test
        app.kubernetes.io/version: "0.0.9"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: social-${namespace}-sa
      containers:
        - name: social
          image: "europe-west1-docker.pkg.dev/cloudappdev-dev/docker-repo/cloudappdev-social-service:0.0.9"
          imagePullPolicy: IfNotPresent
          ports:
            - name: social-port
              containerPort: 8082
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
          startupProbe:
            failureThreshold: 30
            initialDelaySeconds: 5
            periodSeconds: 1
            tcpSocket:
              port: 8082
          livenessProbe:
            initialDelaySeconds: 30
            periodSeconds: 10
            tcpSocket:
              port: 8082
          env:
            - name: NODE_ENV
              value: development
            - name: DB_UID
              valueFrom:
                secretKeyRef:
                  key: DB_UID
                  name: social-service-secrets
            - name: DB_LOCATION
              valueFrom:
                secretKeyRef:
                  key: DB_LOCATION
                  name: social-service-secrets
            - name: DB_ID
              valueFrom:
                secretKeyRef:
                  key: DB_ID
                  name: social-service-secrets
            - name: MONGODB_URI
              value: mongodb://$(DB_UID).$(DB_LOCATION).firestore.goog:443/$(DB_ID)?loadBalanced=true&tls=true&retryWrites=false&authMechanism=MONGODB-OIDC&authMechanismProperties=ENVIRONMENT:gcp,TOKEN_RESOURCE:FIRESTORE
            - name: ITINERARY_SERVICE_URL
              value: http://itinerary-service:8081
            - name: USER_SERVICE_URL
              value: http://user-service:8080
            - name: SENDGRID_API_KEY
              valueFrom:
                secretKeyRef:
                  key: SENDGRID_API_KEY
                  name: social-service-secrets
            - name: SENDGRID_FROM_EMAIL
              valueFrom:
                secretKeyRef:
                  key: SENDGRID_FROM_EMAIL
                  name: social-service-secrets
            - name: NEWSLETTER_FROM_NAME
              valueFrom:
                secretKeyRef:
                  key: SENDGRID_FROM_NAME
                  name: social-service-secrets
            - name: NEWSLETTER_MODE
              value: sendgrid
