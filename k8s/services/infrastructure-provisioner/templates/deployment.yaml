apiVersion: apps/v1
kind: Deployment
metadata:
  name: infrastructure-provisioner
  labels:
    app: infrastructure-provisioner
    tier: infrastructure
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: infrastructure-provisioner
  template:
    metadata:
      labels:
        app: infrastructure-provisioner
        tier: infrastructure
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      initContainers:
      - name: init-terraform
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ['sh', '-c']
        args:
        - |
          echo "[Init] Copying Terraform configs to volume..."
          cp -r /terraform-src/* /terraform/
          ls -la /terraform/environments/{{ .Values.environment }}/
        volumeMounts:
        - name: terraform-volume
          mountPath: /terraform
      containers:
      - name: provisioner
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.service.targetPort }}
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "{{ .Values.service.targetPort }}"
        - name: ENVIRONMENT
          value: "{{ .Values.environment }}"
        - name: GCP_PROJECT
          value: "{{ .Values.gcp.project }}"
        - name: GCP_REGION
          value: "{{ .Values.gcp.region }}"
        - name: TERRAFORM_STATE_BUCKET
          value: "{{ .Values.terraform.stateBucket }}"
        - name: TERRAFORM_STATE_PREFIX
          value: "{{ .Values.terraform.statePrefix }}"
        - name: CLOUDFLARE_ZONE_ID
          value: "{{ .Values.cloudflare.zoneId }}"
        - name: CLOUDFLARE_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflare-credentials
              key: api-token
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: terraform-volume
          mountPath: /terraform
        - name: kubeconfig
          mountPath: /root/.kube
          readOnly: true
      volumes:
      - name: terraform-volume
        emptyDir: {}
      - name: kubeconfig
        secret:
          secretName: kubeconfig
          optional: true
