# Namespace where this chart will be deployed
# Tenant service stays in default namespace (shared infrastructure service)
# Uses Enterprise tier settings
namespace: default

image:
  repository: europe-west1-docker.pkg.dev/cloudappdev-dev/docker-repo/cloudappdev-tenant-service
  pullPolicy: IfNotPresent
  tag: ""

container:
  port: 8084
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "2Gi"

podLabels:
  tier: enterprise

initContainers:
  - name: cloud-sql-proxy
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
    restartPolicy: Always
    securityContext:
      runAsNonRoot: true
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"

env:
  - name: NODE_ENV
    value: "development"
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: tenant-service-secrets
        key: DATABASE_URL
  - name: PROVISIONING_SERVICE_URL
    valueFrom:
      secretKeyRef:
        name: tenant-service-secrets
        key: PROVISIONING_SERVICE_URL
  - name: FREE_TENANT_NAME
    value: "Free Community"
  - name: JWT_SECRET
    valueFrom:
      secretKeyRef:
        name: tenant-service-secrets
        key: JWT_SECRET
  - name: JWT_EXPIRATION
    value: "7d" 

serviceAccount:
  create: true

service:
  type: ClusterIP
  port: 8084

startupProbe:
  tcpSocket:
    port: 8084
  initialDelaySeconds: 10
  failureThreshold: 30
  periodSeconds: 2
livenessProbe:
  tcpSocket:
    port: 8084
  initialDelaySeconds: 30
  periodSeconds: 10

# Enterprise tier autoscaling
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
