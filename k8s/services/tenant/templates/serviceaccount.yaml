{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tenant.serviceAccountName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}

  annotations:
    iam.gke.io/gcp-service-account: "tenant-{{ $.Values.namespace }}-sa@cloudappdev-dev.iam.gserviceaccount.com"
{{- end }}
