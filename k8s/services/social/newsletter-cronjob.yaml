apiVersion: batch/v1
kind: CronJob
metadata:
  name: social-newsletter-weekly
  namespace: default
  labels:
    app: cloudappdev
    service: social-service
    component: newsletter
  annotations:
    description: "Weekly newsletter distribution job for CloudAppDev platform"
spec:
  # Schedule: Sunday 8 PM UTC (20:00)
  # Format: minute hour day-of-month month day-of-week
  schedule: "0 20 * * 0"
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      # Job timeout: 15 minutes
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: cloudappdev
            service: social-service
            job-type: newsletter
          annotations:
            description: "Weekly newsletter send job"
        spec:
          serviceAccountName: cloudappdev-sa
          restartPolicy: OnFailure
          containers:
          - name: newsletter-sender
            image: europe-west1-docker.pkg.dev/oceanic-citadel-474512-c1/docker-repo/cloudappdev-social-service:0.2.30
            imagePullPolicy: Always
            command:
            - npm
            - run
            - newsletter:send-weekly
            env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: social-service-secrets
                  key: MONGODB_URI
            - name: SENDGRID_API_KEY
              valueFrom:
                secretKeyRef:
                  name: social-service-secrets
                  key: SENDGRID_API_KEY
            - name: SENDGRID_FROM_EMAIL
              valueFrom:
                secretKeyRef:
                  name: social-service-secrets
                  key: SENDGRID_FROM_EMAIL
            - name: SENDGRID_FROM_NAME
              valueFrom:
                secretKeyRef:
                  name: social-service-secrets
                  key: SENDGRID_FROM_NAME
            - name: USER_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: social-service-secrets
                  key: USER_SERVICE_URL
            - name: ITINERARY_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: social-service-secrets
                  key: ITINERARY_SERVICE_URL
            - name: NEWSLETTER_ENABLED
              value: "true"
            - name: NEWSLETTER_BATCH_SIZE
              value: "50"
            - name: NEWSLETTER_RETRY_LIMIT
              value: "3"
            - name: NEWSLETTER_RETRY_DELAY_MS
              value: "5000"
            - name: FRONTEND_URL
              valueFrom:
                secretKeyRef:
                  name: social-service-secrets
                  key: FRONTEND_URL
            - name: NODE_ENV
              value: "production"
            - name: NEWSLETTER_MODE
              valueFrom:
                secretKeyRef:
                  name: social-service-secrets
                  key: NEWSLETTER_MODE
            resources:
              requests:
                memory: "512Mi"
                cpu: "250m"
              limits:
                memory: "1Gi"
                cpu: "1000m"
          tolerations:
          - key: "batch-jobs"
            operator: "Equal"
            value: "true"
            effect: "NoSchedule"
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                    - key: app
                      operator: In
                      values:
                      - cloudappdev-app
                  topologyKey: kubernetes.io/hostname