# Namespace where this chart will be deployed
# Default namespace uses Enterprise tier settings
namespace: default

image:
  repository: europe-west1-docker.pkg.dev/cloudappdev-dev/docker-repo/cloudappdev-social-service
  pullPolicy: IfNotPresent
  tag: ""

container:
  port: 8082
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "2Gi"

podLabels:
  tier: enterprise

env:
  - name: NODE_ENV
    value: "development"
  - name: MONGODB_URI
    valueFrom:
      secretKeyRef:
        name: social-service-secrets
        key: MONGODB_URI 
  - name: ITINERARY_SERVICE_URL
    value: "itinerary-service:8081"
  - name: USER_SERVICE_URL
    value: "user-service:8080"
  - name: SENDGRID_API_KEY
    valueFrom:
      secretKeyRef:
        name: social-service-secrets
        key: SENDGRID_API_KEY
  - name: SENDGRID_FROM_EMAIL
    valueFrom:
      secretKeyRef:
        name: social-service-secrets
        key: SENDGRID_FROM_EMAIL
  - name: NEWSLETTER_FROM_NAME
    valueFrom:
      secretKeyRef:
        name: social-service-secrets
        key: SENDGRID_FROM_NAME
  - name: NEWSLETTER_MODE
    value: "sendgrid"

serviceAccount:
  create: true

service:
  type: ClusterIP
  port: 8082

startupProbe:
  tcpSocket:
    port: 8082
  initialDelaySeconds: 5
  failureThreshold: 30
  periodSeconds: 1
livenessProbe:
  tcpSocket:
    port: 8082
  initialDelaySeconds: 30
  periodSeconds: 10

# Enterprise tier autoscaling: high availability with aggressive scaling
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

# Newsletter CronJob Configuration - Enterprise tier settings
newsletter:
  enabled: true
  schedule: "0 20 * * 0"  # Sunday 8 PM UTC
  image:
    tag: ""
  failedJobsHistoryLimit: 5
  successfulJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  backoffLimit: 2
  ttlSecondsAfterFinished: 7200
  env:
    NEWSLETTER_ENABLED: "true"
    NEWSLETTER_BATCH_SIZE: "100"
    NEWSLETTER_RETRY_LIMIT: "5"
    NEWSLETTER_RETRY_DELAY_MS: "3000"
    NODE_ENV: "production"
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"
  tolerations:
    - key: "batch-jobs"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
