# Namespace where this chart will be deployed
namespace: default

image:
  repository: europe-west1-docker.pkg.dev/cloudappdev-dev/docker-repo/cloudappdev-social-service
  pullPolicy: IfNotPresent
  tag: ""

container:
  port: 8082
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"

podLabels: {}

env:
  - name: NODE_ENV
    value: "development"
  - name: DB_UID
    valueFrom:
      secretKeyRef:
        name: social-service-secrets
        key: DB_UID
  - name: DB_LOCATION
    valueFrom:
      secretKeyRef:
        name: social-service-secrets
        key: DB_LOCATION
  - name: DB_ID
    valueFrom:
      secretKeyRef:
        name: social-service-secrets
        key: DB_ID
  - name: MONGODB_URI
    value: mongodb://$(DB_UID).$(DB_LOCATION).firestore.goog:443/$(DB_ID)?loadBalanced=true&tls=true&retryWrites=false&authMechanism=MONGODB-OIDC&authMechanismProperties=ENVIRONMENT:gcp,TOKEN_RESOURCE:FIRESTORE
  - name: ITINERARY_SERVICE_URL
    value: "itinerary-service:8081"
  - name: USER_SERVICE_URL
    value: "user-service:8080"
  - name: SENDGRID_API_KEY
    valueFrom:
      secretKeyRef:
        name: social-service-secrets
        key: SENDGRID_API_KEY
  - name: SENDGRID_FROM_EMAIL
    valueFrom:
      secretKeyRef:
        name: social-service-secrets
        key: SENDGRID_FROM_EMAIL
  - name: NEWSLETTER_FROM_NAME
    valueFrom:
      secretKeyRef:
        name: social-service-secrets
        key: SENDGRID_FROM_NAME
  - name: NEWSLETTER_MODE
    value: "sendgrid"

serviceAccount:
  create: true
  annotations:
    iam.gke.io/gcp-service-account: "social-${namespace}-sa@cloudappdev-dev.iam.gserviceaccount.com"
  name: "social-${namespace}-sa"

service:
  type: ClusterIP
  port: 8082

startupProbe:
  tcpSocket:
    port: 8082
  initialDelaySeconds: 5
  failureThreshold: 30
  periodSeconds: 1
livenessProbe:
  tcpSocket:
    port: 8082
  initialDelaySeconds: 30
  periodSeconds: 10

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75

# Newsletter CronJob Configuration
newsletter:
  enabled: true
  schedule: "0 20 * * 0"  # Sunday 8 PM UTC
  image:
    tag: "0.2.30"  # Can be overridden
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  env:
    NEWSLETTER_ENABLED: "true"
    NEWSLETTER_BATCH_SIZE: "50"
    NEWSLETTER_RETRY_LIMIT: "3"
    NEWSLETTER_RETRY_DELAY_MS: "5000"
    NODE_ENV: "production"
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
  tolerations:
    - key: "batch-jobs"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
