apiVersion: apps/v1
kind: Deployment
metadata:
  name: social-service
spec:
  selector:
    matchLabels:
      app: social-service
  template:
    metadata:
      labels:
        app: social-service
    spec:
      serviceAccountName: cloudappdev-sa
      containers:
      - name: social-service
        image: europe-west1-docker.pkg.dev/oceanic-citadel-474512-c1/docker-repo/cloudappdev-social-service:0.2.31
        resources:
          limits:
            memory: "512Mi"
            cpu: "1000m"
          requests:
            memory: "128Mi"
            cpu: "200m"
        ports:
        - containerPort: 8082
          name: social-port
        startupProbe:
          tcpSocket:
            port: 8082
          initialDelaySeconds: 5
          failureThreshold: 30
          periodSeconds: 1
        livenessProbe:
          tcpSocket:
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 10
        env:
        - name: NODE_ENV
          valueFrom:
            secretKeyRef:
              name: social-service-secrets
              key: NODE_ENV
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: social-service-secrets
              key: MONGODB_URI
        - name: ITINERARY_SERVICE_URL
          valueFrom:
            secretKeyRef:
              name: social-service-secrets
              key: ITINERARY_SERVICE_URL
        - name: USER_SERVICE_URL
          valueFrom:
            secretKeyRef:
              name: social-service-secrets
              key: USER_SERVICE_URL
        - name: SENDGRID_API_KEY
          valueFrom:
            secretKeyRef:
              name: social-service-secrets
              key: SENDGRID_API_KEY
        - name: SENDGRID_FROM_EMAIL
          valueFrom:
            secretKeyRef:
              name: social-service-secrets
              key: SENDGRID_FROM_EMAIL
        - name: NEWSLETTER_FROM_NAME
          valueFrom:
            secretKeyRef:
              name: social-service-secrets
              key: SENDGRID_FROM_NAME
        - name: NEWSLETTER_MODE
          valueFrom:
            secretKeyRef:
              name: social-service-secrets
              key: NEWSLETTER_MODE
        