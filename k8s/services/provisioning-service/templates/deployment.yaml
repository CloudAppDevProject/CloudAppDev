apiVersion: apps/v1
kind: Deployment
metadata:
  name: provisioning-service
  labels:
    app: provisioning-service
    tier: infrastructure
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: provisioning-service
  template:
    metadata:
      labels:
        app: provisioning-service
        tier: infrastructure
    spec:
      serviceAccountName: {{ include "provisioning.serviceAccountName" . }}
      initContainers:
      - name: init-terraform
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ['sh', '-c']
        args:
        - |
          echo "[Init] Copying Terraform configs to volume..."
          cp -r /terraform-src/* /terraform/

          echo "[Init] Creating terraform.tfvars for {{ .Values.environment }}-tenants..."
          cat > /terraform/environments/{{ .Values.environment }}-tenants/terraform.tfvars <<EOF
          # Terraform Variables for Tenant Infrastructure
          # Auto-generated by provisioning-service init container

          project_id         = "{{ .Values.gcp.project }}"
          region             = "{{ .Values.gcp.region }}"
          environment        = "{{ .Values.environment }}"
          project_name       = "cloudappdev"
          cloudflare_zone_id = "{{ .Values.cloudflare.zoneId }}"
          EOF

          echo "[Init] Verifying files..."
          ls -la /terraform/environments/{{ .Values.environment }}-tenants/
          cat /terraform/environments/{{ .Values.environment }}-tenants/terraform.tfvars
        volumeMounts:
        - name: terraform-volume
          mountPath: /terraform
      containers:
      - name: provisioner
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.service.targetPort }}
          protocol: TCP
        env:
        {{- toYaml .Values.env | nindent 8 }}
        - name: PORT
          value: "{{ .Values.service.targetPort }}"
        - name: ENVIRONMENT
          value: "{{ .Values.environment }}"
        - name: GCP_PROJECT
          value: "{{ .Values.gcp.project }}"
        - name: GCP_REGION
          value: "{{ .Values.gcp.region }}"
        - name: TERRAFORM_STATE_BUCKET
          value: "{{ .Values.terraform.stateBucket }}"
        - name: TERRAFORM_STATE_PREFIX
          value: "{{ .Values.terraform.statePrefix }}"
        - name: CLOUDFLARE_ZONE_ID
          value: "{{ .Values.cloudflare.zoneId }}"
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: terraform-volume
          mountPath: /terraform
        - name: kubeconfig
          mountPath: /root/.kube
          readOnly: true
      volumes:
      - name: terraform-volume
        emptyDir: {}
      - name: kubeconfig
        secret:
          secretName: kubeconfig
          optional: true
