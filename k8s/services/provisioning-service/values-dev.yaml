replicaCount: 1

image:
  repository: europe-west1-docker.pkg.dev/cloudappdev-dev/docker-repo/cloudappdev-provisioning-service
  pullPolicy: IfNotPresent
  tag: ""

service:
  type: ClusterIP
  port: 8090
  targetPort: 8080

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false

environment: dev

namespace: default

env: 
  - name: NODE_ENV
    value: "development"
  - name: IMAGE_TAG
    valueFrom:
      secretKeyRef:
        name: provisioning-service-secrets
        key: IMAGE_TAG
  - name: GCP_MONITORING_CREDENTIALS_BASE64
    valueFrom:
      secretKeyRef:
        name: provisioning-service-secrets
        key: GCP_MONITORING_CREDENTIALS_BASE64
  - name: GCP_SERVICE_ACCOUNT_KEY
    valueFrom:
      secretKeyRef:
        name: provisioning-service-secrets
        key: GCP_SERVICE_ACCOUNT_KEY
  - name: SENDGRID_API_KEY
    valueFrom:
      secretKeyRef:
        name: provisioning-service-secrets
        key: SENDGRID_API_KEY
  - name: FIREBASE_SERVICE_ACCOUNT_JSON_BASE64
    valueFrom:
      secretKeyRef:
        name: provisioning-service-secrets
        key: FIREBASE_SERVICE_ACCOUNT_JSON_BASE64
# Service account with permissions to manage GKE resources
serviceAccount:
  create: true

# Terraform state backend
terraform:
  stateBackend: gcs
  stateBucket: cloudappdev-tf-state-dev
  statePrefix: environments/dev-tenants

# GCP configuration
gcp:
  project: cloudappdev-dev
  region: europe-west1

# Cloudflare configuration (from secrets)
cloudflare:
  zoneId: ddbd47810ae075fc0bc55a4ef05a91ec

# Deployment version sync CronJob
deploymentSync:
  enabled: true
  schedule: "*/10 * * * *"  # Every 10 minutes
