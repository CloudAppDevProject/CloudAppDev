apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "itinerary.fullname" . }}
  labels:
    {{- include "itinerary.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "itinerary.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "itinerary.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      initContainers:
        {{- toYaml .Values.initContainers | nindent 8 }}
      serviceAccountName: {{ include "itinerary.serviceAccountName" . }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: itinerary-port
              containerPort: {{ .Values.container.port }}
          {{- with .Values.container.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- toYaml .Values.env | nindent 12 }}
