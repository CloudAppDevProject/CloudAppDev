# Namespace where this chart will be deployed
# Default namespace uses Enterprise tier settings
namespace: default

image:
  repository: europe-west1-docker.pkg.dev/cloudappdev-dev/docker-repo/cloudappdev-travel-info-service
  pullPolicy: IfNotPresent
  tag: ""

container:
  port: 8083
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "2Gi"

podLabels:
  tier: enterprise

env:
  - name: WEATHER_API_KEY
    valueFrom:
      secretKeyRef:
        name: travel-info-secrets
        key: WEATHER_API_KEY

service:
  type: ClusterIP
  port: 8083

# Adding probes for better health monitoring
startupProbe:
  tcpSocket:
    port: 8083
  initialDelaySeconds: 5
  failureThreshold: 30
  periodSeconds: 1
readinessProbe:
  tcpSocket:
    port: 8083
  initialDelaySeconds: 5
  failureThreshold: 30
  periodSeconds: 1
livenessProbe:
  tcpSocket:
    port: 8083
  initialDelaySeconds: 30
  periodSeconds: 10

# Enterprise tier autoscaling: high availability with aggressive scaling
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
