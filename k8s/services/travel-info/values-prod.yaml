# Namespace where this chart will be deployed
namespace: default

image:
  repository: europe-west1-docker.pkg.dev/oceanic-citadel-474512-c1/docker-repo/cloudappdev-travel-info-service
  pullPolicy: IfNotPresent
  tag: ""

container:
  port: 8083
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"

podLabels: {}

env:
  - name: WEATHER_API_KEY
    valueFrom:
      secretKeyRef:
        name: travel-info-secrets
        key: WEATHER_API_KEY

service:
  type: ClusterIP
  port: 8083

# Adding probes for better health monitoring
startupProbe:
  tcpSocket:
    port: 8083
  initialDelaySeconds: 5
  failureThreshold: 30
  periodSeconds: 1
readinessProbe:
  tcpSocket:
    port: 8083
  initialDelaySeconds: 5
  failureThreshold: 30
  periodSeconds: 1
livenessProbe:
  tcpSocket:
    port: 8083
  initialDelaySeconds: 30
  periodSeconds: 10

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
