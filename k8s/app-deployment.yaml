apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudappdev-frontend
  namespace: default
spec:
  selector:
    matchLabels:
      app: cloudappdev-frontend
  template:
    metadata:
      labels:
        app: cloudappdev-frontend
    spec:
      serviceAccountName: cloudappdev-sa
      containers:
        - name: frontend
          image: europe-west1-docker.pkg.dev/oceanic-citadel-474512-c1/docker-repo/cloudappdev-frontend:0.2.14
          ports:
            - containerPort: 3000
              name: frontend-port
          env:
            - name: API_GATEWAY_URL
              valueFrom:
                secretKeyRef:
                  name: cloudappdev-secrets
                  key: API_GATEWAY_URL
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet: 
              path: "/"
              port: 3000
          readinessProbe:
            httpGet: 
              path: "/"
              port: 3000