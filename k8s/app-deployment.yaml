apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudappdev-frontend
  namespace: default
spec:
  selector:
    matchLabels:
      app: cloudappdev-frontend
  template:
    metadata:
      labels:
        app: cloudappdev-frontend
    spec:
      serviceAccountName: cloudappdev-sa
      containers:
        - name: frontend
          image: europe-west1-docker.pkg.dev/oceanic-citadel-474512-c1/docker-repo/cloudappdev-frontend:0.2.15
          ports:
            - containerPort: 3000
              name: frontend-port
          env:
            - name: API_GATEWAY_URL
              valueFrom:
                secretKeyRef:
                  name: cloudappdev-secrets
                  key: API_GATEWAY_URL
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "600m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: "/"
              port: 3000
            initialDelaySeconds: 10
            failureThreshold: 30
            periodSeconds: 1
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: "/"
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: "/"
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 2