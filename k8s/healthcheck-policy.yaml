apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: cloudappdev-frontend-hc
  namespace: default
spec:
  default:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    config:
      type: HTTP
      httpHealthCheck:
        portSpecification: USE_SERVING_PORT
        requestPath: /  
  targetRef:
    group: ""                  
    kind: Service
    name: cloudappdev-frontend
