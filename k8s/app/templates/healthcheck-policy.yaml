apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: {{ include "app.fullname" . }}
  namespace: {{ .Values.namespace }}
spec:
  default:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    config:
      type: TCP
      httpHealthCheck:
        portSpecification: USE_SERVING_PORT
        requestPath: /  
  targetRef:
    group: ""                  
    kind: Service
    name: {{ include "app.fullname" . }}
