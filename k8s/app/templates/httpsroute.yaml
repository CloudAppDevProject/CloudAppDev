{{- if .Values.httpsRoute.enabled -}}
{{- $fullName := include "app.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-https
  namespace: default
  labels:
    {{- include "app.labels" . | nindent 4 }}
  {{- with .Values.httpsRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ $fullName }}-gateway
      sectionName: https
  hostnames:
    {{- toYaml .Values.httpsRoute.hostnames | nindent 4 }}
  rules:
    {{- range .Values.httpsRoute.rules }}
    {{- with .matches }}
    - matches:
      {{- toYaml . | nindent 8 }}
    {{- end }}
      backendRefs:
        - name: {{ $fullName }}
          port: {{ $svcPort }}
          kind: Service
    {{- end }}
{{- end }}
