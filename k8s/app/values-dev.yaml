# Namespace where this chart will be deployed
namespace: default

# Gateway namespace (if gateway is in a different namespace)
gatewayNamespace: default

image:
  repository: europe-west1-docker.pkg.dev/cloudappdev-dev/docker-repo/cloudappdev-frontend
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

serviceAccount:
  create: false

service:
  type: ClusterIP
  port: 80

env:
  - name: API_GATEWAY_URL
    value: "http://api-gateway:80"
  - name: NODE_ENV
    value: "development"
  - name: APP_MODE
    valueFrom: 
      secretKeyRef:
        name: app-secrets
        key: APP_MODE
  - name: GCP_PROJECT_ID
    valueFrom:
      secretKeyRef:
        name: app-secrets
        key: GCP_PROJECT_ID
  - name: JWT_SECRET
    valueFrom:
      secretKeyRef:
        name: app-secrets
        key: JWT_SECRET
  - name: GCP_MONITORING_CREDENTIALS_BASE64
    valueFrom:
      secretKeyRef:
        name: app-secrets
        key: GCP_MONITORING_CREDENTIALS_BASE64
        
api:
  className: "gke-l7-global-external-managed"
  annotations: {}
  hostname: dev.cloudappdev.site

httpRoute:
  enabled: true
  annotations: {}
  parentRefs:
  - name: main-gateway
    sectionName: http
    namespace: default
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301

httpsRoute:
  enabled: true
  annotations: {}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75