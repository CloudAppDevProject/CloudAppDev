# Upstream for User Service
# Using resolver to enable dynamic DNS resolution for Kubernetes service discovery
upstream user_service {
    zone user_service 64k;
    server user-service:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Upstream for Itinerary Service
upstream itinerary_service {
    zone itinerary_service 64k;
    server itinerary-service:8081 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Upstream for Social Service
upstream social_service {
    zone social_service 64k;
    server localhost:8082 max_fails=1 fail_timeout=1s;
    server social-service:8082 backup;
    keepalive 32;
}

# Upstream for Travel Info Service
upstream travel_info_service {
    zone travel_info_service 64k;
    server travel-info-service:8083 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Upstream for Tenant Service
upstream tenant_service {
    zone tenant_service 64k;
    server tenant-service:8084 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80 backlog=2048;
    server_name localhost;

    # Enable dynamic DNS resolution (varies by environment)
    # In Kubernetes: kube-dns.kube-system.svc.cluster.local
    # In Docker: Docker daemon or system resolver (127.0.0.11:53)
    resolver $RESOLVER_IP valid=10s;
    resolver_timeout 5s;

    # Increase body size for file uploads
    client_max_body_size 50M;

    # Optimize proxy buffering
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 24 4k;
    proxy_busy_buffers_size 8k;

    # Connection reuse
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # User Service Auth Routes
    location /api/v1/auth {
        proxy_pass http://user_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Optimize for auth/registration requests
        proxy_connect_timeout 10s;
        proxy_send_timeout 20s;
        proxy_read_timeout 30s;
    }

    # User Service Routes
    location /api/v1/users {
        proxy_pass http://user_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # User management requests
        proxy_connect_timeout 10s;
        proxy_send_timeout 20s;
        proxy_read_timeout 30s;
    }

    # Itinerary Service Routes
    location /api/v1/itineraries {
        proxy_pass http://itinerary_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Social Service Routes
    # Supports both local development (npm run start:dev) and Docker deployment
    location /api/v1/social {
        proxy_pass http://social_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # Increase timeout for newsletter sends which can take time
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Travel Info Service Routes
    location /api/v1/travel-info {
        proxy_pass http://travel_info_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Tenant Service Routes
    location /api/v1/tenants {
        proxy_pass http://tenant_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/v1/roles {
        proxy_pass http://tenant_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/v1/user-roles {
        proxy_pass http://tenant_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Default response for unknown routes
    location / {
        return 404 '{"error": "Not Found", "message": "Use /api/v1/users, /api/v1/itineraries, /api/v1/social, /api/v1/tenants, or /api/v1/travel-info"}';
        add_header Content-Type application/json;
    }
}
