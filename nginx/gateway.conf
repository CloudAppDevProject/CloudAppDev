# Docker DNS resolver - force dynamic DNS resolution
resolver 127.0.0.11 valid=10s;
resolver_timeout 5s;

server {
    listen 80;
    server_name localhost;

    # Increase body size for file uploads
    client_max_body_size 50M;

    # User Service Routes
    location /api/v1/users {
        set $upstream_users user-service:8080;
        proxy_pass http://$upstream_users;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Itinerary Service Routes
    location /api/v1/itineraries {
        set $upstream_itineraries itinerary-service:8081;
        proxy_pass http://$upstream_itineraries;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Social Service Routes
    location /api/v1/social {
        set $upstream_social social-service:8082;
        proxy_pass http://$upstream_social;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Default response for unknown routes
    location / {
        return 404 '{"error": "Not Found", "message": "Use /api/v1/users, /api/v1/itineraries, or /api/v1/social"}';
        add_header Content-Type application/json;
    }
}
