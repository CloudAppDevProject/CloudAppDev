# NOTE: No upstream blocks defined - using dynamic resolution with variables
# This allows nginx to start even when backend services are unavailable
# DNS resolution happens at request time, not at startup

server {
    listen 80 backlog=2048;
    server_name localhost;

    # Enable dynamic DNS resolution (varies by environment)
    # In Kubernetes: kube-dns.kube-system.svc.cluster.local
    # In Docker: Docker daemon or system resolver (127.0.0.11:53)
    resolver ${RESOLVER_IP} valid=10s ipv6=off;
    resolver_timeout 5s;

    # Increase body size for file uploads
    client_max_body_size 50M;

    # Optimize proxy buffering
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 24 4k;
    proxy_busy_buffers_size 8k;

    # Connection reuse
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Common proxy headers (applied to all locations)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # User Service Auth Routes
    location /api/v1/auth {
        # Use variable to enable dynamic DNS resolution at request time
        set $user_service_host "user-service:8080";
        proxy_pass http://$user_service_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Optimize for auth/registration requests
        proxy_connect_timeout 10s;
        proxy_send_timeout 20s;
        proxy_read_timeout 30s;

        # Return 503 if service unavailable
        error_page 502 503 504 = @service_unavailable;
    }

    # User Service Routes
    location /api/v1/users {
        set $user_service_host "user-service:8080";
        proxy_pass http://$user_service_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # User management requests
        proxy_connect_timeout 10s;
        proxy_send_timeout 20s;
        proxy_read_timeout 30s;

        error_page 502 503 504 = @service_unavailable;
    }

    # Itinerary Service Routes
    location /api/v1/itineraries {
        set $itinerary_service_host "itinerary-service:8081";
        proxy_pass http://$itinerary_service_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        error_page 502 503 504 = @service_unavailable;
    }

    # Social Service Routes
    # Supports both local development (npm run start:dev) and Docker deployment
    location /api/v1/social {
        set $social_service_host "social-service:8082";
        proxy_pass http://$social_service_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # Increase timeout for newsletter sends which can take time
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        error_page 502 503 504 = @service_unavailable;
    }

    # Travel Info Service Routes
    location /api/v1/travel-info {
        set $travel_info_service_host "travel-info-service:8083";
        proxy_pass http://$travel_info_service_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        error_page 502 503 504 = @service_unavailable;
    }

    # Tenant Service Routes
    location /api/v1/tenants {
        set $tenant_service_host "tenant-service:8084";
        proxy_pass http://$tenant_service_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        error_page 502 503 504 = @service_unavailable;
    }

    # Named location for service unavailable errors
    location @service_unavailable {
        default_type application/json;
        return 503 '{"error": "Service Unavailable", "message": "The requested service is temporarily unavailable. Please try again later."}';
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Default response for unknown routes
    location / {
        return 404 '{"error": "Not Found", "message": "Use /api/v1/users, /api/v1/itineraries, /api/v1/social, /api/v1/tenants, or /api/v1/travel-info"}';
        add_header Content-Type application/json;
    }
}
