# Upstream for User Service (in Docker)
upstream user_service {
    server user-service:8080;
}

# Upstream for Itinerary Service (in Docker)
upstream itinerary_service {
    server itinerary-service:8081;
}

# Upstream for Social Service
# Supports both Docker and local development
upstream social_service {
    # Try localhost first for local development
    server localhost:8082 max_fails=1 fail_timeout=1s;
    # Fallback to Docker network
    server social-service:8082 backup;
}

upstream travel_info_service {
    server travel-info-service:8083;
}

server {
    listen 80;
    server_name localhost;

    # Increase body size for file uploads
    client_max_body_size 50M;

    # User Service Routes
    location /api/v1/users {
        proxy_pass http://user_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Itinerary Service Routes
    location /api/v1/itineraries {
        proxy_pass http://itinerary_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Social Service Routes
    # Supports both local development (npm run start:dev) and Docker deployment
    location /api/v1/social {
        proxy_pass http://social_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # Increase timeout for newsletter sends which can take time
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Weather Service Routes
    location /api/v1/travel-info {
        proxy_pass http://travel_info_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }


    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Default response for unknown routes
    location / {
        return 404 '{"error": "Not Found", "message": "Use /api/v1/users, /api/v1/itineraries, or /api/v1/social"}';
        add_header Content-Type application/json;
    }
}
