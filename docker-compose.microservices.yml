services:
  # ==================== DATABASES ====================
  postgres-users:
    image: postgres:16-alpine
    container_name: cloudappdev_postgres_users
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "max_connections=1000"
      - "-c"
      - "shared_buffers=256MB"
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: devpass123
    ports:
      - "5433:5432"
    volumes:
      - postgres-users-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d users_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-itineraries:
    image: postgres:16-alpine
    container_name: cloudappdev_postgres_itineraries
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "max_connections=1000"
      - "-c"
      - "shared_buffers=256MB"
    environment:
      POSTGRES_DB: itineraries_db
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: devpass123
    ports:
      - "5434:5432"
    volumes:
      - postgres-itineraries-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d itineraries_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb-social:
    image: mongo:8.0
    container_name: cloudappdev_mongodb_social
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=social_db
    volumes:
      - mongodb-social-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-tenants:
    image: postgres:16-alpine
    container_name: cloudappdev_postgres_tenants
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "max_connections=500"
      - "-c"
      - "shared_buffers=128MB"
    environment:
      POSTGRES_DB: tenant_db
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: devpass123
    ports:
      - "5435:5432"
    volumes:
      - postgres-tenants-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d tenant_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==================== MICROSERVICES ====================
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile.dev
    container_name: cloudappdev_user_service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - PORT=8080
      - DATABASE_URL=postgresql://appuser:devpass123@postgres-users:5432/users_db?schema=public
      - JWT_SECRET=dev-jwt-secret-change-in-production
      - JWT_EXPIRATION=7d
      - TENANT_SERVICE_URL=http://tenant-service:8084
    env_file:
      - ./services/user-service/.env
    volumes:
      - ./services/user-service:/app
      - /app/node_modules
    depends_on:
      postgres-users:
        condition: service_healthy
      tenant-service:
        condition: service_started
    command: sh -c "npm install --legacy-peer-deps && npx prisma generate && npx prisma migrate deploy && npm run start:dev"

  itinerary-service:
    build:
      context: ./services/itinerary-service
      dockerfile: Dockerfile.dev
    container_name: cloudappdev_itinerary_service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - NODE_ENV=development
      - PORT=8081
      - DATABASE_URL=postgresql://appuser:devpass123@postgres-itineraries:5432/itineraries_db?schema=public
      - USER_SERVICE_URL=http://user-service:8080
      - SOCIAL_SERVICE_URL=http://social-service:8082
    env_file:
      - ./services/itinerary-service/.env
    volumes:
      - ./services/itinerary-service:/app
      - /app/node_modules
    depends_on:
      postgres-itineraries:
        condition: service_healthy
      user-service:
        condition: service_started
    command: sh -c "npm install --legacy-peer-deps && npx prisma generate && npx prisma migrate deploy && npm run start:dev"

  social-service:
    build:
      context: ./services/social-service
      dockerfile: Dockerfile.dev
    container_name: cloudappdev_social_service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - NODE_ENV=development
      - PORT=8082
      - MONGODB_URI=mongodb://mongodb-social:27017/social_db
      - USER_SERVICE_URL=http://user-service:8080
      - ITINERARY_SERVICE_URL=http://itinerary-service:8081
      - NEWSLETTER_SMTP_HOST=smtp.gmail.com
      - NEWSLETTER_SMTP_PORT=587
      - NEWSLETTER_FROM_EMAIL=noreply@cloudappdev.com
      - NEWSLETTER_FROM_NAME=CloudAppDev Newsletters
      - NEWSLETTER_ENABLED=true
      - NEWSLETTER_BATCH_SIZE=50
      - NEWSLETTER_RETRY_LIMIT=3
      - NEWSLETTER_RETRY_DELAY_MS=5000
    env_file:
      - ./services/social-service/.env
    volumes:
      - ./services/social-service:/app
      - /app/node_modules
    depends_on:
      mongodb-social:
        condition: service_healthy
      user-service:
        condition: service_started
      itinerary-service:
        condition: service_started
    command: sh -c "npm install --legacy-peer-deps && npm run start:dev"

  travel-info-service:
    build:
      context: ./services/travel-info-service
      dockerfile: Dockerfile
    container_name: cloudappdev_travel_info_service
    restart: unless-stopped
    ports:
      - "8083:8083"
    env_file:
      - ./services/travel-info-service/.env
    depends_on:
      user-service:
        condition: service_started

  tenant-service:
    build:
      context: ./services/tenant-service
      dockerfile: Dockerfile.dev
    container_name: cloudappdev_tenant_service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      - NODE_ENV=development
      - PORT=8084
      - DATABASE_URL=postgresql://appuser:devpass123@postgres-tenants:5432/tenant_db?schema=public
      - USER_SERVICE_URL=http://user-service:8080
      - JWT_SECRET=dev-jwt-secret-change-in-production
      - FREE_TENANT_NAME=Free Community
    env_file:
      - ./services/tenant-service/.env
    volumes:
      - ./services/tenant-service:/app
      - /app/node_modules
    depends_on:
      postgres-tenants:
        condition: service_healthy
    command: sh -c "npm install --legacy-peer-deps && npx prisma generate && npx prisma migrate deploy && npm run seed && npm run start:dev"

  # ==================== API GATEWAY ====================
  api-gateway:
    build:
      context: ./nginx
      dockerfile: Dockerfile.gateway
    container_name: cloudappdev_api_gateway
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      # Use Docker's built-in DNS resolver for service discovery
      # In Docker Compose: 127.0.0.11:53 (Docker daemon's embedded DNS server)
      # Override with RESOLVER_IP=kube-dns.kube-system.svc.cluster.local for Kubernetes
      RESOLVER_IP: "127.0.0.11"
    depends_on:
      - user-service
      - itinerary-service
      - social-service
      - tenant-service
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # ==================== MONITORING ====================
  # Prometheus container REMOVED - Using GCP Cloud Monitoring directly
  #
  # Local Dev: Services still expose /metrics endpoints on ports 8080-8084
  # Production (GKE): Use "gcloud container clusters update --enable-managed-prometheus"
  #
  # See: docs/TELEMETRY_SIMPLE_SOLUTION.md for details

volumes:
  postgres-users-data:
  postgres-itineraries-data:
  mongodb-social-data:
  postgres-tenants-data:
