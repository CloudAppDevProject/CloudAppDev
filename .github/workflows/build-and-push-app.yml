name: Build and Push App to GCR
on:
  # Trigger on push to main branch
  push:
    branches:
      - develop
    paths:
      - 'app/**'
      - 'lib/**'
      - 'prisma/**'
      - 'public/**'
      - 'Dockerfile'
      - 'package.json'
      - '.github/workflows/build-and-push-app.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Manual tag for the Docker image'
        required: false
        default: 'manual'
  
env:
  IMAGE_NAME: cloudappdev
  ARTIFACT_REGISTRY_HOSTNAME: europe-west1-docker.pkg.dev
  REPOSITORY_NAME: docker-repo
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Google Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ARTIFACT_REGISTRY_HOSTNAME }}
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}
      
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ARTIFACT_REGISTRY_HOSTNAME }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag with 'latest' on main branch
            type=raw,value=latest,enable={{is_default_branch}}
            # Tag with git SHA (short)
            type=sha,prefix=sha-,format=short
            # Tag with semver for version tags (v1.0.0 -> 1.0.0)
            type=semver,pattern={{version}}
            # Tag with semver major.minor (v1.0.0 -> 1.0)
            type=semver,pattern={{major}}.{{minor}}
            # Tag with PR number for pull requests
            type=ref,event=pr,prefix=pr-
            # Tag with manual input if workflow_dispatch
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          # Build args - Server-side variables (defaults are fine for build)
          # ⚠️ CRITICAL: Client-side NEXT_PUBLIC_* variables MUST be set from secrets!
          # These are baked into the JavaScript bundle at build time
          build-args: |
            DATABASE_URL_BUILD=${{ secrets.DATABASE_URL_BUILD || 'postgresql://build:build@localhost:5432/build?schema=public' }}
            MONGODB_URI_BUILD=${{ secrets.MONGODB_URI_BUILD || 'mongodb://build:build@localhost:27017/build' }}
            GCS_CREDENTIALS_BUILD=${{ secrets.GCS_CREDENTIALS_BUILD || 'build-dummy-credentials' }}
            GCS_PROJECT_BUILD=${{ secrets.GCS_PROJECT_BUILD || 'build-project' }}
            GCS_BUCKET_BUILD=${{ secrets.GCS_BUCKET_BUILD || 'build-bucket' }}
            FIREBASE_CREDENTIALS_BUILD=${{ secrets.FIREBASE_CREDENTIALS_BUILD || 'build-dummy-firebase' }}
            FIREBASE_API_KEY_BUILD=${{ secrets.NEXT_PUBLIC_GOOGLE_CLOUD_AUTH_KEY }}
            FIREBASE_AUTH_DOMAIN_BUILD=${{ secrets.NEXT_PUBLIC_GOOGLE_CLOUD_AUTH_DOMAIN }}
            FIREBASE_PROJECT_BUILD=${{ secrets.NEXT_PUBLIC_GOOGLE_CLOUD_PROJECT_ID }}
      
      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.build.outputs.digest }}"
      
      - name: Summary
        run: |
          echo "## 🐳 Docker Image Built Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** \`${{ env.GCR_HOSTNAME }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY