name: Build and Push Seeder to Prod

concurrency:
  group: build-seeder-prod-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    tags:
      - '*.*.*'
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: europe-west1-docker.pkg.dev
  IMAGE_NAME: seeder

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version
        id: version
        run: |
          # Get short SHA for reference
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short-sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

          # Production: Use git tag as version (must exist!)
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LATEST_TAG" ]; then
            echo "❌ ERROR: No git tag found for production build!"
            echo ""
            echo "Production builds require a git tag to be created first."
            echo "Please create and push a tag before pushing to master:"
            echo ""
            echo "  git tag v1.0.0"
            echo "  git push origin master --tags"
            echo ""
            echo "Or if the tag already exists remotely:"
            echo "  git fetch --tags"
            exit 1
          fi

          # Remove 'v' prefix if present
          BUILD_VERSION=${LATEST_TAG#v}

          echo "version=${BUILD_VERSION}" >> $GITHUB_OUTPUT
          echo "🚀 Using production version from tag: ${BUILD_VERSION}"
          echo "📝 Short SHA: ${SHORT_SHA}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Google Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY_PROD }}

      - name: Build and push Docker image with all tags
        run: |
          FULL_VERSION="${{ steps.version.outputs.version }}"
          SHORT_SHA="${{ steps.version.outputs.short-sha }}"
          PROJECT_ID="${{ secrets.GCP_PROJECT_ID_PROD }}"

          # Extract major.minor for additional tag (e.g., 1.0.5 -> 1.0)
          SHORT_VERSION=$(echo "$FULL_VERSION" | sed -E 's/^([0-9]+\.[0-9]+).*/\1/')

          docker buildx build \
            --platform linux/amd64 \
            -f services/seeder/Dockerfile \
            -t ${{ env.REGISTRY }}/${PROJECT_ID}/docker-repo/${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.REGISTRY }}/${PROJECT_ID}/docker-repo/${{ env.IMAGE_NAME }}:${FULL_VERSION} \
            -t ${{ env.REGISTRY }}/${PROJECT_ID}/docker-repo/${{ env.IMAGE_NAME }}:${SHORT_VERSION} \
            -t ${{ env.REGISTRY }}/${PROJECT_ID}/docker-repo/${{ env.IMAGE_NAME }}:sha-${SHORT_SHA} \
            --push \
            .

      - name: Output image details
        run: |
          FULL_VERSION="${{ steps.version.outputs.version }}"
          SHORT_SHA="${{ steps.version.outputs.short-sha }}"
          SHORT_VERSION=$(echo "$FULL_VERSION" | sed -E 's/^([0-9]+\.[0-9]+).*/\1/')

          echo "✅ Seeder image pushed successfully to PROD!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** \`prod\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${FULL_VERSION}\` (from git tag)" >> $GITHUB_STEP_SUMMARY
          echo "**SHA:** \`${SHORT_SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags pushed:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${FULL_VERSION}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${SHORT_VERSION}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`sha-${SHORT_SHA}\`" >> $GITHUB_STEP_SUMMARY
