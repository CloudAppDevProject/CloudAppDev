name: Build and Push to Dev (Development)

concurrency:
  group: build-services-dev-${{ github.ref }}
  cancel-in-progress: true


on:
  push:
    branches:
      - develop
      - feature/multi-tenancy
    paths:
      - 'app/**'
      - 'lib/**'
      - 'public/**'
      - 'services/**'
      - 'nginx/**'
      - 'Dockerfile'
      - 'package.json'
      - '.github/workflows/build-and-push-dev.yml'
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to build'
        required: false
        type: choice
        default: 'all'
        options:
          - all
          - changed-only
          - frontend
          - user-service
          - itinerary-service
          - social-service
          - travel-info-service
          - tenant-service
          - provisioning-service
          - api-gateway

env:
  ARTIFACT_REGISTRY_HOSTNAME: europe-west1-docker.pkg.dev

jobs:
  prepare:
    environment: dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      services: ${{ steps.set-matrix.outputs.services }}
      version: ${{ steps.version.outputs.version }}
      short-sha: ${{ steps.version.outputs.short-sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'app/**'
              - 'lib/**'
              - 'public/**'
              - 'Dockerfile'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'next.config.ts'
              - './k8s/app/**'
            user-service:
              - 'services/user-service/**'
              - 'k8s/services/user/**'
            itinerary-service:
              - 'services/itinerary-service/**'
              - 'k8s/services/itinerary/**'
            social-service:
              - 'services/social-service/**'
              - 'k8s/services/social/**'
            travel-info-service:
              - 'services/travel-info-service/**'
              - 'k8s/services/travel-info/**'
            tenant-service:
              - 'services/tenant-service/**'
              - 'k8s/services/tenant/**'
            provisioning-service:
              - 'services/provisioning-service/**'
              - 'terraform/**'
              - 'k8s/**'
            api-gateway:
              - 'nginx/**'
              - 'k8s/gateway/**'
            workflow:
              - '.github/workflows/build-and-push-dev.yml'

      - name: Generate version
        id: version
        run: |
          # Get short SHA for reference
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short-sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

          # Development: Auto-incrementing build number
          BUILD_NUMBER="${{ github.run_number }}"
          BUILD_VERSION="0.0.${BUILD_NUMBER}"

          echo "version=${BUILD_VERSION}" >> $GITHUB_OUTPUT
          echo "🔧 Generated dev version: ${BUILD_VERSION}"
          echo "📝 Short SHA: ${SHORT_SHA}"

      - name: Set service matrix
        id: set-matrix
        run: |
          SERVICES_INPUT="${{ github.event.inputs.services }}"

          # Manual trigger with "all" - force build everything
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$SERVICES_INPUT" = "all" ]; then
            SERVICES='["frontend","user-service","itinerary-service","social-service","travel-info-service","tenant-service","provisioning-service","api-gateway"]'
            echo "Manual trigger (all) - building all services"
          # Manual trigger with specific service
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$SERVICES_INPUT" ] && [ "$SERVICES_INPUT" != "all" ] && [ "$SERVICES_INPUT" != "changed-only" ]; then
            SERVICES="[\"$SERVICES_INPUT\"]"
            echo "Manual trigger - building: ${SERVICES}"
          # Workflow file changed or manual "changed-only" - build everything as safety measure
          elif [ "${{ steps.changes.outputs.workflow }}" = "true" ]; then
            SERVICES='["frontend","user-service","itinerary-service","social-service","travel-info-service","tenant-service","provisioning-service","api-gateway"]'
            echo "⚠️ Workflow changed - building all services for safety"
          else
            # Build only changed services
            SERVICES="[]"

            if [ "${{ steps.changes.outputs.frontend }}" = "true" ]; then
              SERVICES=$(echo "$SERVICES" | jq -c '. + ["frontend"]')
            fi
            if [ "${{ steps.changes.outputs.user-service }}" = "true" ]; then
              SERVICES=$(echo "$SERVICES" | jq -c '. + ["user-service"]')
            fi
            if [ "${{ steps.changes.outputs.itinerary-service }}" = "true" ]; then
              SERVICES=$(echo "$SERVICES" | jq -c '. + ["itinerary-service"]')
            fi
            if [ "${{ steps.changes.outputs.social-service }}" = "true" ]; then
              SERVICES=$(echo "$SERVICES" | jq -c '. + ["social-service"]')
            fi
            if [ "${{ steps.changes.outputs.travel-info-service }}" = "true" ]; then
              SERVICES=$(echo "$SERVICES" | jq -c '. + ["travel-info-service"]')
            fi
            if [ "${{ steps.changes.outputs.tenant-service }}" = "true" ]; then
              SERVICES=$(echo "$SERVICES" | jq -c '. + ["tenant-service"]')
            fi
            if [ "${{ steps.changes.outputs.provisioning-service }}" = "true" ]; then
              SERVICES=$(echo "$SERVICES" | jq -c '. + ["provisioning-service"]')
            fi
            if [ "${{ steps.changes.outputs.api-gateway }}" = "true" ]; then
              SERVICES=$(echo "$SERVICES" | jq -c '. + ["api-gateway"]')
            fi

            # If no services changed, build nothing
            if [ "$SERVICES" = "[]" ]; then
              echo "No service files changed - skipping build"
            else
              echo "Building changed services: ${SERVICES}"
            fi
          fi

          echo "services=${SERVICES}" >> $GITHUB_OUTPUT

  build-and-push:
    environment: dev
    needs: prepare
    # Skip job if no services to build
    if: needs.prepare.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.prepare.outputs.services) }}
      fail-fast: false

    permissions:
      contents: read
      packages: write


    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set service configuration
        id: config
        run: |
          case "${{ matrix.service }}" in
            "frontend")
              echo "image-name=cloudappdev-frontend" >> $GITHUB_OUTPUT
              echo "context=." >> $GITHUB_OUTPUT
              echo "dockerfile=./Dockerfile" >> $GITHUB_OUTPUT
              echo "description=CloudAppDev Next.js Frontend Application" >> $GITHUB_OUTPUT
              ;;
            "user-service")
              echo "image-name=cloudappdev-user-service" >> $GITHUB_OUTPUT
              echo "context=./services/user-service" >> $GITHUB_OUTPUT
              echo "dockerfile=./services/user-service/Dockerfile" >> $GITHUB_OUTPUT
              echo "description=CloudAppDev User Management Microservice" >> $GITHUB_OUTPUT
              ;;
            "itinerary-service")
              echo "image-name=cloudappdev-itinerary-service" >> $GITHUB_OUTPUT
              echo "context=./services/itinerary-service" >> $GITHUB_OUTPUT
              echo "dockerfile=./services/itinerary-service/Dockerfile" >> $GITHUB_OUTPUT
              echo "description=CloudAppDev Itinerary Management Microservice" >> $GITHUB_OUTPUT
              ;;
            "social-service")
              echo "image-name=cloudappdev-social-service" >> $GITHUB_OUTPUT
              echo "context=./services/social-service" >> $GITHUB_OUTPUT
              echo "dockerfile=./services/social-service/Dockerfile" >> $GITHUB_OUTPUT
              echo "description=CloudAppDev Social Features Microservice" >> $GITHUB_OUTPUT
              ;;
            "travel-info-service")
              echo "image-name=cloudappdev-travel-info-service" >> $GITHUB_OUTPUT
              echo "context=./services/travel-info-service" >> $GITHUB_OUTPUT
              echo "dockerfile=./services/travel-info-service/Dockerfile" >> $GITHUB_OUTPUT
              echo "description=CloudAppDev Travel Information Microservice" >> $GITHUB_OUTPUT
              ;;
            "tenant-service")
              echo "image-name=cloudappdev-tenant-service" >> $GITHUB_OUTPUT
              echo "context=./services/tenant-service" >> $GITHUB_OUTPUT
              echo "dockerfile=./services/tenant-service/Dockerfile" >> $GITHUB_OUTPUT
              echo "description=CloudAppDev Tenant Management Microservice" >> $GITHUB_OUTPUT
              ;;
            "provisioning-service")
              echo "image-name=cloudappdev-provisioning-service" >> $GITHUB_OUTPUT
              echo "context=." >> $GITHUB_OUTPUT
              echo "dockerfile=./services/provisioning-service/Dockerfile" >> $GITHUB_OUTPUT
              echo "description=CloudAppDev Infrastructure Provisioning Service (NestJS)" >> $GITHUB_OUTPUT
              ;;
            "api-gateway")
              echo "image-name=cloudappdev-api-gateway" >> $GITHUB_OUTPUT
              echo "context=./nginx" >> $GITHUB_OUTPUT
              echo "dockerfile=./nginx/Dockerfile.gateway" >> $GITHUB_OUTPUT
              echo "description=CloudAppDev NGINX API Gateway" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "Unknown service: ${{ matrix.service }}"
              exit 1
              ;;
          esac


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Google Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ARTIFACT_REGISTRY_HOSTNAME }}
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ARTIFACT_REGISTRY_HOSTNAME }}/${{ secrets.GCP_PROJECT_ID }}/docker-repo/${{ steps.config.outputs.image-name }}
          flavor: |
            latest=auto
          tags: |
            # Tag with 'latest' for dev
            type=raw,value=latest
            # Tag with auto-increment version (e.g., 0.0.42)
            type=raw,value=${{ needs.prepare.outputs.version }}
            # Tag with short SHA for reference (e.g., sha-abc1234)
            type=raw,value=sha-${{ needs.prepare.outputs.short-sha }}
          labels: |
            org.opencontainers.image.title=${{ steps.config.outputs.image-name }}
            org.opencontainers.image.description=${{ steps.config.outputs.description }}
            org.opencontainers.image.vendor=CloudAppDev
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            com.cloudappdev.service=${{ matrix.service }}
            com.cloudappdev.environment=dev
            com.cloudappdev.build.number=${{ github.run_number }}
            com.cloudappdev.git.sha=${{ github.sha }}
            com.cloudappdev.git.branch=${{ github.ref_name }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.config.outputs.context }}
          file: ${{ steps.config.outputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}-dev
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-dev
          platforms: linux/amd64
          target: ${{ matrix.service != 'api-gateway' && 'production' || '' }}

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.build.outputs.digest }}"

      - name: Service summary
        run: |
          echo "## 🐳 ${{ matrix.service }} Built Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ steps.config.outputs.image-name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** \`dev\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ needs.prepare.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**SHA:** \`${{ needs.prepare.outputs.short-sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  deploy:
    environment: dev
    needs: [prepare, build-and-push]
    # Only deploy if services were built successfully
    if: needs.prepare.outputs.services != '[]' && needs.build-and-push.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.prepare.outputs.services) }}
      fail-fast: false

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER_NAME }}
          location: ${{ secrets.GKE_CLUSTER_LOCATION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Set Helm chart path and namespaces
        id: chart
        run: |
          case "${{ matrix.service }}" in
            "frontend")
              echo "path=./k8s/app" >> $GITHUB_OUTPUT
              echo "release=app" >> $GITHUB_OUTPUT
              # Deploy frontend to cloudappdev, free, and standard namespaces
              echo "namespaces=cloudappdev,free,standard" >> $GITHUB_OUTPUT
              ;;
            "user-service")
              echo "path=./k8s/services/user" >> $GITHUB_OUTPUT
              echo "release=user-service" >> $GITHUB_OUTPUT
              # Deploy to free and standard namespaces only
              echo "namespaces=free,standard" >> $GITHUB_OUTPUT
              ;;
            "itinerary-service")
              echo "path=./k8s/services/itinerary" >> $GITHUB_OUTPUT
              echo "release=itinerary-service" >> $GITHUB_OUTPUT
              # Deploy to free and standard namespaces only
              echo "namespaces=free,standard" >> $GITHUB_OUTPUT
              ;;
            "social-service")
              echo "path=./k8s/services/social" >> $GITHUB_OUTPUT
              echo "release=social-service" >> $GITHUB_OUTPUT
              # Deploy to free and standard namespaces only
              echo "namespaces=free,standard" >> $GITHUB_OUTPUT
              ;;
            "travel-info-service")
              echo "path=./k8s/services/travel-info" >> $GITHUB_OUTPUT
              echo "release=travel-info-service" >> $GITHUB_OUTPUT
              # Deploy to default namespace only
              echo "namespaces=default" >> $GITHUB_OUTPUT
              ;;
            "tenant-service")
              echo "path=./k8s/services/tenant" >> $GITHUB_OUTPUT
              echo "release=tenant-service" >> $GITHUB_OUTPUT
              # Deploy to default namespace only
              echo "namespaces=default" >> $GITHUB_OUTPUT
              ;;
            "provisioning-service")
              echo "path=./k8s/services/provisioning-service" >> $GITHUB_OUTPUT
              echo "release=provisioning-service" >> $GITHUB_OUTPUT
              # Deploy to default namespace only
              echo "namespaces=default" >> $GITHUB_OUTPUT
              ;;
            "api-gateway")
              echo "path=./k8s/gateway" >> $GITHUB_OUTPUT
              echo "release=api-gateway" >> $GITHUB_OUTPUT
              # Deploy API gateway to cloudappdev, free, and standard namespaces
              echo "namespaces=cloudappdev,free,standard" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "Unknown service: ${{ matrix.service }}"
              exit 1
              ;;
          esac
      
      
      - name: Obtain GCP secrets
        id: secrets
        run: |
          NAMESPACES="${{ steps.chart.outputs.namespaces }}"

          case "${{ matrix.service }}" in
            "user-service")
              IFS=',' read -ra NS_ARRAY <<< "$NAMESPACES"
              for NAMESPACE in "${NS_ARRAY[@]}"; do
                SECRET_VALUE=$(gcloud secrets versions access latest --secret="${NAMESPACE}-users-password")
                if {[ -z "$SECRET_VALUE" ]; then
                  echo "❌ ERROR: Retrieved empty secret for ${NAMESPACE}-users-password"
                  exit 1
                fi
                echo "user_${NAMESPACE}_db_password=${SECRET_VALUE}" >> $GITHUB_ENV
              done
              ;;
            "itinerary-service")
              IFS=',' read -ra NS_ARRAY <<< "$NAMESPACES"
              for NAMESPACE in "${NS_ARRAY[@]}"; do
                SECRET_VALUE=$(gcloud secrets versions access latest --secret="${NAMESPACE}-itinerary-password")
                if {[ -z "$SECRET_VALUE" ]; then
                  echo "❌ ERROR: Retrieved empty secret for ${NAMESPACE}-itinerary-password"
                  exit 1
                fi
                echo "itinerary_${NAMESPACE}_db_password=${SECRET_VALUE}" >> $GITHUB_ENV
              done
              ;;
            "tenant-service")
              IFS=',' read -ra NS_ARRAY <<< "$NAMESPACES"
              for NAMESPACE in "${NS_ARRAY[@]}"; do
                SECRET_VALUE=$(gcloud secrets versions access latest --secret="${NAMESPACE}-tenant-password")
                if {[ -z "$SECRET_VALUE" ]; then
                  echo "❌ ERROR: Retrieved empty secret for ${NAMESPACE}-tenant-password"
                  exit 1
                fi
                echo "tenant_${NAMESPACE}_db_password=${SECRET_VALUE}" >> $GITHUB_ENV
              done
              ;;
            *)
              echo "No secrets required for: ${{ matrix.service }}"
              ;;
          esac

      - name: Deploy with Helm
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FIREBASE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
       
        run: |
          echo "Loading GitHub env vars..."
          set -a
          source $GITHUB_ENV
          set +a
          VERSION="${{ needs.prepare.outputs.version }}"
          NAMESPACES="${{ steps.chart.outputs.namespaces }}"

          echo "🚀 Deploying ${{ matrix.service }} with version ${VERSION} to namespaces: ${NAMESPACES}"

          # Split namespaces by comma and deploy to each
          IFS=',' read -ra NS_ARRAY <<< "$NAMESPACES"
          for NAMESPACE in "${NS_ARRAY[@]}"; do
            echo ""
            echo "📦 Deploying to namespace: ${NAMESPACE}"

            # Create namespace if it doesn't exist
            kubectl create namespace ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -

            # Deploy service-specific secrets to namespace
            echo "🔐 Deploying secrets for ${{ matrix.service }} to ${NAMESPACE}"
            case "${{ matrix.service }}" in

              "user-service")
                SECRET_NAME="user-service-secrets"

                VAR_NAME="user_${NAMESPACE}_db_password"
                RAW_DB_PASSWORD="${!VAR_NAME}"
                encodedPassword=$(printf %s "$RAW_DB_PASSWORD" | jq -s -R -r @uri)
                echo "🔄 Recreating secret ${SECRET_NAME} in ${NAMESPACE}"
                kubectl delete secret ${SECRET_NAME} -n ${NAMESPACE} --ignore-not-found

                DB_URL="postgresql://users:${encodedPassword}@127.0.0.1:5432/users?schema=public"
                kubectl create secret generic "${SECRET_NAME}" \
                  --from-literal=DATABASE_URL="$DB_URL" \
                  --from-literal=JWT_SECRET="$JWT_SECRET" \
                  --from-literal=FIREBASE_SERVICE_ACCOUNT_JSON_BASE64="$FIREBASE_SERVICE_ACCOUNT_JSON_BASE64" \
                  --from-literal=GOOGLE_CLOUD_STORAGE_BUCKET="cloudappdev-${NAMESPACE}-images" \
                  --from-literal=GOOGLE_CLOUD_CREDENTIALS_BASE64="$GCP_SA_KEY" \
                  --from-literal=GOOGLE_CLOUD_PROJECT_ID="$GCP_PROJECT_ID" \
                  --namespace "${NAMESPACE}"
                ;;

              "itinerary-service")
                SECRET_NAME="itinerary-service-secrets"


                VAR_NAME="itinerary_${NAMESPACE}_db_password"
                DB_PASSWORD="${!VAR_NAME}"
                encodedPassword=$(printf %s "$DB_PASSWORD" | jq -s -R -r @uri)

                echo "🔄 Recreating secret ${SECRET_NAME} in ${NAMESPACE}"
                kubectl delete secret ${SECRET_NAME} -n ${NAMESPACE} --ignore-not-found

                ITINERARY_DB_URL="postgresql://itinerary:${encodedPassword}@127.0.0.1:5432/itinerary?schema=public"
                kubectl create secret generic "${SECRET_NAME}" \
                  --from-literal=DATABASE_URL="$ITINERARY_DB_URL" \
                  --from-literal=FIREBASE_SERVICE_ACCOUNT_JSON_BASE64="$FIREBASE_SERVICE_ACCOUNT_JSON_BASE64" \
                  --from-literal=GOOGLE_CLOUD_STORAGE_BUCKET="cloudappdev-${NAMESPACE}-images" \
                  --from-literal=GOOGLE_CLOUD_CREDENTIALS_BASE64="$GCP_SA_KEY" \
                  --from-literal=GOOGLE_CLOUD_PROJECT_ID="$GCP_PROJECT_ID" \
                  --namespace ${NAMESPACE}
                ;;

              "social-service")
                SECRET_NAME="social-service-secrets"

                echo "🔄 Recreating secret ${SECRET_NAME} in ${NAMESPACE}"
                kubectl delete secret ${SECRET_NAME} -n ${NAMESPACE} --ignore-not-found

                # Fetch Firestore database UID for MongoDB API connection
                DB_ID="cloudappdev-${NAMESPACE}-social"
                DB_LOCATION="europe-west1"
                echo "📡 Fetching Firestore database UID for ${DB_ID}..."
                DB_UID=$(gcloud firestore databases describe --database="${DB_ID}" --format="value(uid)" 2>/dev/null || echo "")
               
                if [ -z "$DB_UID" ]; then
                  echo "⚠️ WARNING: Could not fetch Firestore database UID for ${DB_ID}"
                  echo "⚠️ Make sure the Firestore database exists and Terraform has been applied"
                  exit 1
                else
                  echo "✅ Firestore database UID: ${DB_UID}"
                fi

                # Build the full MongoDB URI for Firestore MongoDB API
                MONGODB_URI="mongodb://${DB_UID}.${DB_LOCATION}.firestore.goog:443/${DB_ID}?loadBalanced=true&tls=true&retryWrites=false&authMechanism=MONGODB-OIDC&authMechanismProperties=ENVIRONMENT:gcp,TOKEN_RESOURCE:FIRESTORE"
                echo "✅ MongoDB URI constructed for Firestore database"

                kubectl create secret generic ${SECRET_NAME} \
                  --from-literal=DB_UID="${DB_UID}" \
                  --from-literal=DB_LOCATION="${DB_LOCATION}" \
                  --from-literal=DB_ID="${DB_ID}" \
                  --from-literal=MONGODB_URI="${MONGODB_URI}" \
                  --from-literal=ITINERARY_SERVICE_URL="http://itinerary-service:8081" \
                  --from-literal=USER_SERVICE_URL="http://user-service:8080" \
                  --from-literal=SENDGRID_API_KEY="${{ secrets.SENDGRID_API_KEY }}" \
                  --from-literal=SENDGRID_FROM_EMAIL="${{ secrets.SENDGRID_FROM_EMAIL }}" \
                  --from-literal=SENDGRID_FROM_NAME="${{ secrets.SENDGRID_FROM_NAME }}" \
                  --from-literal=NEWSLETTER_MODE="sendgrid" \
                  --namespace ${NAMESPACE}
                ;;

              "tenant-service")
                SECRET_NAME="tenant-service-secrets"

                VAR_NAME="tenant_${NAMESPACE}_db_password"
                DB_PASSWORD="${!VAR_NAME}"
                encodedPassword=$(printf %s "$DB_PASSWORD" | jq -s -R -r @uri)

                echo "🔄 Recreating secret ${SECRET_NAME} in ${NAMESPACE}"
                kubectl delete secret ${SECRET_NAME} -n ${NAMESPACE} --ignore-not-found

                TENANT_DB_URL="postgresql://tenant:${encodedPassword}@127.0.0.1:5432/tenant?schema=public"
                kubectl create secret generic ${SECRET_NAME} \
                  --from-literal=DATABASE_URL="$TENANT_DB_URL" \
                  --from-literal=JWT_SECRET="$JWT_SECRET" \
                  --from-literal=PROVISIONING_SERVICE_URL="http://provisioning-service:8080" \
                  --namespace ${NAMESPACE}
                ;;

              "provisioning-service")
                SECRET_NAME="provisioning-service-secrets"

                echo "🔄 Recreating secret ${SECRET_NAME} in ${NAMESPACE}"
                kubectl delete secret ${SECRET_NAME} -n ${NAMESPACE} --ignore-not-found

                kubectl create secret generic ${SECRET_NAME} \
                  --from-literal=GCP_SERVICE_ACCOUNT_KEY="$GCP_SA_KEY" \
                  --namespace ${NAMESPACE}
                ;;

              "travel-info-service")
                SECRET_NAME="travel-info-secrets"

                echo "🔄 Recreating secret ${SECRET_NAME} in ${NAMESPACE}"
                kubectl delete secret ${SECRET_NAME} -n ${NAMESPACE} --ignore-not-found

                kubectl create secret generic ${SECRET_NAME} \
                  --from-literal=WEATHER_API_KEY="$WEATHER_API_KEY" \
                  --namespace ${NAMESPACE}
                ;;

              "frontend")
                SECRET_NAME="cloudappdev-secrets"

                echo "🔄 Recreating secret ${SECRET_NAME} in ${NAMESPACE}"
                kubectl delete secret ${SECRET_NAME} -n ${NAMESPACE} --ignore-not-found

                kubectl create secret generic ${SECRET_NAME} \
                  --from-literal=API_GATEWAY_URL='api-gateway:80' \
                  --from-literal=JWT_SECRET=c2VjcmV0X2tleV9mb3Jfand0 \
                  --from-literal=APP_MODE=HUB \
                  --from-literal=GCP_PROJECT_ID=cloudappdev-dev \
                  --from-literal=GCP_MONITORING_CREDENTIALS_BASE64='' \
                  --namespace ${NAMESPACE}
                ;;

              "api-gateway")
                echo "ℹ️ API Gateway is stateless (no secrets needed)"
                ;;
            esac

            # Check for stuck Helm releases and fix by deleting ALL stuck secrets
            RELEASE_STATUS=$(helm status ${{ steps.chart.outputs.release }} -n ${NAMESPACE} -o json 2>/dev/null | jq -r '.info.status' || echo "not-found")
            if [ "$RELEASE_STATUS" = "pending-install" ] || [ "$RELEASE_STATUS" = "pending-upgrade" ] || [ "$RELEASE_STATUS" = "pending-rollback" ]; then
              echo "⚠️ Found stuck release in ${NAMESPACE} with status: ${RELEASE_STATUS}"
              echo "🔄 Cleaning up ALL stuck Helm secrets..."

              # Get all revisions with pending status
              helm history ${{ steps.chart.outputs.release }} -n ${NAMESPACE} -o json 2>/dev/null | \
                jq -r '.[] | select(.status | contains("pending")) | .revision' | \
                while read -r revision; do
                  if [ -n "$revision" ]; then
                    echo "🗑️ Deleting stuck secret for revision ${revision}"
                    kubectl delete secret -n ${NAMESPACE} sh.helm.release.v1.${{ steps.chart.outputs.release }}.v${revision} --ignore-not-found=true
                  fi
                done

              # Also clean up by label selector (backup method)
              kubectl delete secret -n ${NAMESPACE} \
                -l "name=${{ steps.chart.outputs.release }},owner=helm,status in (pending-install,pending-upgrade,pending-rollback)" \
                --ignore-not-found=true 2>/dev/null || true

              echo "✓ All stuck Helm secrets cleaned up"

              # Wait a moment for Kubernetes to process deletions
              sleep 2

              echo "✓ Release unlocked, proceeding with deployment"
            fi

            # Disable HTTPRoute and HTTPSRoute for free and standard namespaces (frontend only)
            EXTRA_ARGS=""
            if [ "${{ matrix.service }}" = "frontend" ] && [ "${NAMESPACE}" != "cloudappdev" ]; then
              EXTRA_ARGS="--set httpRoute.enabled=false --set httpsRoute.enabled=false"
              echo "ℹ️ Disabling HTTPRoute and HTTPSRoute for ${NAMESPACE} namespace"
            fi

            # Configure API Gateway namespace routing for multi-tenant deployments
            if [ "${{ matrix.service }}" = "api-gateway" ]; then
              # Set service namespace values based on deployment namespace
              EXTRA_ARGS="${EXTRA_ARGS} --set env[1].name=USER_NAMESPACE --set env[1].value=${NAMESPACE}"
              EXTRA_ARGS="${EXTRA_ARGS} --set env[2].name=ITINERARY_NAMESPACE --set env[2].value=${NAMESPACE}"
              EXTRA_ARGS="${EXTRA_ARGS} --set env[3].name=SOCIAL_NAMESPACE --set env[3].value=${NAMESPACE}"
              echo "ℹ️ Configuring API Gateway for namespace routing (USER/ITINERARY/SOCIAL: ${NAMESPACE}, TRAVEL_INFO/TENANT: default)"
            fi

            # Update Chart.yaml appVersion before deploying
            echo "📝 Updating Chart.yaml appVersion to ${VERSION}"
            sed -i.bak "s/^appVersion:.*/appVersion: \"${VERSION}\"/" ${{ steps.chart.outputs.path }}/Chart.yaml

            helm upgrade --install ${{ steps.chart.outputs.release }} ${{ steps.chart.outputs.path }} \
              --namespace ${NAMESPACE} \
              --values ${{ steps.chart.outputs.path }}/values-dev.yaml \
              --set image.tag=${VERSION} \
              --set namespace=${NAMESPACE} \
              --set fullnameOverride=${{ steps.chart.outputs.release }} \
              ${EXTRA_ARGS} \
              --wait \
              --timeout 5m

            echo "✅ Deployed to ${NAMESPACE}"
          done


      - name: Verify deployment
        run: |
          NAMESPACES="${{ steps.chart.outputs.namespaces }}"
          echo "📋 Verifying deployment for ${{ matrix.service }} across namespaces: ${NAMESPACES}"

          # Split namespaces by comma and verify each
          IFS=',' read -ra NS_ARRAY <<< "$NAMESPACES"
          for NAMESPACE in "${NS_ARRAY[@]}"; do
            echo ""
            echo "📋 Namespace: ${NAMESPACE}"

            kubectl rollout status deployment/${{ steps.chart.outputs.release }} -n ${NAMESPACE} --timeout=3m || true

            echo ""
            echo "📊 Pod status in ${NAMESPACE}:"
            kubectl get pods -n ${NAMESPACE} -l app.kubernetes.io/instance=${{ steps.chart.outputs.release }} --no-headers || true
          done

      - name: Deployment summary
        run: |
          NAMESPACES="${{ steps.chart.outputs.namespaces }}"
          echo "## 🚀 ${{ matrix.service }} Deployed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release:** \`${{ steps.chart.outputs.release }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Namespaces:** \`${NAMESPACES}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ needs.prepare.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY

  summary:
    environment: dev
    needs: [prepare, build-and-push, deploy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Build summary
        run: |
          SERVICES='${{ needs.prepare.outputs.services }}'
          ALL_SERVICES='["frontend","user-service","itinerary-service","social-service","travel-info-service","tenant-service","provisioning-service","api-gateway"]'

          echo "## 📦 Development Build & Deploy Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** \`dev\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ needs.prepare.outputs.version }}\` (auto-incremented)" >> $GITHUB_STEP_SUMMARY
          echo "**SHA:** \`${{ needs.prepare.outputs.short-sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Build status
          BUILD_STATUS="${{ needs.build-and-push.result }}"
          DEPLOY_STATUS="${{ needs.deploy.result }}"

          echo "### 🔨 Build Status: \`${BUILD_STATUS}\`" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Deploy Status: \`${DEPLOY_STATUS}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Services that were built
          BUILT_COUNT=$(echo "$SERVICES" | jq 'length')
          if [ "$BUILT_COUNT" -gt 0 ]; then
            echo "### ✅ Services Built & Deployed ($BUILT_COUNT):" >> $GITHUB_STEP_SUMMARY
            echo "$SERVICES" | jq -r '.[]' | while read service; do
              echo "- ✅ ${service}" >> $GITHUB_STEP_SUMMARY
            done
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          # Services that were skipped
          SKIPPED=$(echo "$ALL_SERVICES" | jq -c --argjson built "$SERVICES" '. - $built')
          SKIPPED_COUNT=$(echo "$SKIPPED" | jq 'length')
          if [ "$SKIPPED_COUNT" -gt 0 ]; then
            echo "### ⏭️ Services Skipped ($SKIPPED_COUNT - no changes detected):" >> $GITHUB_STEP_SUMMARY
            echo "$SKIPPED" | jq -r '.[]' | while read service; do
              echo "- ⏭️ ${service}" >> $GITHUB_STEP_SUMMARY
            done
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
