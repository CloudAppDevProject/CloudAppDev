name: Build and Push Seeder Image

on:
  push:
    branches:
      - develop
      - master
    paths:
      - 'services/seeder/**'
      - 'seed-data/**'
      - 'services/user-service/prisma/**'
      - 'services/itinerary-service/prisma/**'
      - '.github/workflows/build-and-push-seeder.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Custom tag for Docker image (optional)'
        required: false
        default: ''

env:
  REGISTRY: europe-west1-docker.pkg.dev
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  IMAGE_NAME: seeder

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version
        id: version
        run: |
          # Get short SHA for reference
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short-sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

          # Try to get latest git tag, otherwise start at v0.1.0
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")

          # Remove 'v' prefix if present
          VERSION=${LATEST_TAG#v}

          # If on master/main, increment patch version and create git tag
          if [ "${{ github.ref_name }}" = "master" ] || [ "${{ github.ref_name }}" = "main" ]; then
            # Parse version components
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            # Increment patch version
            PATCH=$((PATCH + 1))
            BUILD_VERSION="${MAJOR}.${MINOR}.${PATCH}"

            # Create git tag for this version
            NEW_TAG="v${BUILD_VERSION}"
            echo "Creating git tag: ${NEW_TAG}"
            git tag "${NEW_TAG}" || echo "Tag already exists, skipping creation"
          else
            # For develop branch, add build number (no tag created)
            BUILD_NUMBER="${{ github.run_number }}"
            BUILD_VERSION="${VERSION}-dev.${BUILD_NUMBER}"
          fi

          # Use custom tag if provided (overrides auto-generated version)
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            BUILD_VERSION="${{ github.event.inputs.tag }}"
          fi

          echo "version=${BUILD_VERSION}" >> $GITHUB_OUTPUT
          echo "Generated version: ${BUILD_VERSION}"
          echo "Short SHA: ${SHORT_SHA}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Google Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Push git tag (master/main only)
        if: github.ref_name == 'master' || github.ref_name == 'main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Get the latest tag we just created
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -n "$LATEST_TAG" ]; then
            echo "Pushing tag: ${LATEST_TAG}"
            git push origin "${LATEST_TAG}" || echo "Tag already exists on remote or push failed (non-blocking)"
          fi

      - name: Build and push Docker image with all tags
        run: |
          FULL_VERSION="${{ steps.version.outputs.version }}"
          SHORT_SHA="${{ steps.version.outputs.short-sha }}"
          
          # Extract major.minor for additional tag (e.g., 0.1.5 -> 0.1)
          # For Windows/Linux compatibility, use basic shell instead of grep -P
          SHORT_VERSION=$(echo "$FULL_VERSION" | sed -E 's/^([0-9]+\.[0-9]+).*/\1/')
          
          docker buildx build \
            --platform linux/amd64 \
            -f services/seeder/Dockerfile \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/docker-repo/${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/docker-repo/${{ env.IMAGE_NAME }}:${FULL_VERSION} \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/docker-repo/${{ env.IMAGE_NAME }}:${SHORT_VERSION} \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/docker-repo/${{ env.IMAGE_NAME }}:sha-${SHORT_SHA} \
            --push \
            .

      - name: Output image details
        run: |
          FULL_VERSION="${{ steps.version.outputs.version }}"
          SHORT_SHA="${{ steps.version.outputs.short-sha }}"
          SHORT_VERSION=$(echo "$FULL_VERSION" | sed -E 's/^([0-9]+\.[0-9]+).*/\1/')
          
          echo "✅ Seeder image pushed successfully!"
          echo ""
          echo "📦 Image tags pushed:"
          echo "   • ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/docker-repo/${{ env.IMAGE_NAME }}:latest"
          echo "   • ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/docker-repo/${{ env.IMAGE_NAME }}:${FULL_VERSION}"
          echo "   • ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/docker-repo/${{ env.IMAGE_NAME }}:${SHORT_VERSION}"
          echo "   • ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/docker-repo/${{ env.IMAGE_NAME }}:sha-${SHORT_SHA}"
          echo ""
          echo "🏷️  Version: ${FULL_VERSION}"
          echo "🔗 Branch: ${{ github.ref_name }}"
          echo "📝 Commit: ${SHORT_SHA}"
