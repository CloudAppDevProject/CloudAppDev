name: Build and Push Seeder to Dev

concurrency:
  group: build-seeder-dev-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - develop
    paths:
      - 'services/seeder/**'
      - 'seed-data/**'
      - 'services/user-service/prisma/**'
      - 'services/itinerary-service/prisma/**'
      - '.github/workflows/build-and-push-seeder-dev.yml'
  workflow_dispatch:

env:
  REGISTRY: europe-west1-docker.pkg.dev
  IMAGE_NAME: seeder

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version
        id: version
        run: |
          # Get short SHA for reference
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short-sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

          # Development: Auto-incrementing build number
          BUILD_NUMBER="${{ github.run_number }}"
          BUILD_VERSION="0.0.${BUILD_NUMBER}"

          echo "version=${BUILD_VERSION}" >> $GITHUB_OUTPUT
          echo "🔧 Generated dev version: ${BUILD_VERSION}"
          echo "📝 Short SHA: ${SHORT_SHA}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Google Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY_DEV }}

      - name: Build and push Docker image with all tags
        run: |
          FULL_VERSION="${{ steps.version.outputs.version }}"
          SHORT_SHA="${{ steps.version.outputs.short-sha }}"
          PROJECT_ID="${{ secrets.GCP_PROJECT_ID_DEV }}"

          docker buildx build \
            --platform linux/amd64 \
            -f services/seeder/Dockerfile \
            -t ${{ env.REGISTRY }}/${PROJECT_ID}/docker-repo/${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.REGISTRY }}/${PROJECT_ID}/docker-repo/${{ env.IMAGE_NAME }}:${FULL_VERSION} \
            -t ${{ env.REGISTRY }}/${PROJECT_ID}/docker-repo/${{ env.IMAGE_NAME }}:sha-${SHORT_SHA} \
            --push \
            .

      - name: Output image details
        run: |
          FULL_VERSION="${{ steps.version.outputs.version }}"
          SHORT_SHA="${{ steps.version.outputs.short-sha }}"

          echo "✅ Seeder image pushed successfully to DEV!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** \`dev\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${FULL_VERSION}\` (auto-incremented)" >> $GITHUB_STEP_SUMMARY
          echo "**SHA:** \`${SHORT_SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags pushed:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${FULL_VERSION}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`sha-${SHORT_SHA}\`" >> $GITHUB_STEP_SUMMARY
